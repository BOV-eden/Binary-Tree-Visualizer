<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>二叉树可视化矩阵 - Mobile Ready</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050a14;
            --panel-bg: rgba(10, 17, 40, 0.85);
            --accent-cyan: #00f7ff;
            --accent-blue: #0066ff;
            --highlight-gold: #ffd700; 
            --text-color: #aaddff;
            --grid-line: rgba(0, 247, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Orbitron', 'Noto Sans SC', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 禁止溢出滚动 */
            
            /* 关键修改2：禁止浏览器的默认触摸操作（如双击缩放、滚动） */
            touch-action: none; 
            -webkit-user-select: none; /* 禁止选中文本 */
            user-select: none;
            
            background-image: 
                linear-gradient(30deg, var(--grid-line) 12%, transparent 12.5%, transparent 87%, var(--grid-line) 87.5%, var(--grid-line)),
                linear-gradient(150deg, var(--grid-line) 12%, transparent 12.5%, transparent 87%, var(--grid-line) 87.5%, var(--grid-line)),
                radial-gradient(circle at 50% 50%, rgba(0, 102, 255, 0.15), transparent 70%);
            background-size: 40px 70px, 40px 70px, 100% 100%;
            background-position: 0 0, 0 0, 0 0;
        }

        .title-bar {
            height: 50px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            padding: 0 15px;
            border-bottom: 1px solid var(--accent-blue);
            flex-shrink: 0; /* 防止被压缩 */
        }
        .title-bar h1 { font-size: 16px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .main-container {
            flex: 1;
            position: relative;
            cursor: grab;
            overflow: hidden;
            touch-action: none; /* 再次确保画布区域不响应默认手势 */
        }
        .main-container:active { cursor: grabbing; }

        svg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .link {
            fill: none;
            stroke: var(--accent-cyan);
            stroke-width: 2;
            opacity: 0.6;
        }

        .node {
            position: absolute;
            width: 44px; /* 稍微调小一点适应手机 */
            height: 44px;
            background: radial-gradient(circle at 30% 30%, var(--accent-cyan), var(--accent-blue));
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 0 10px var(--accent-blue);
            border: 1px solid rgba(255,255,255,0.5);
            z-index: 10;
            /* 关键修改3：确保节点可以被触摸 */
            touch-action: none; 
            transform: translate(-50%, -50%);
        }
        
        .node.active {
            background: radial-gradient(circle at 30% 30%, #fff, var(--highlight-gold));
            box-shadow: 0 0 20px var(--highlight-gold);
            color: #000;
            transform: translate(-50%, -50%) scale(1.2);
        }

        /* 移动端适配控制面板 */
        .control-panel {
            background: var(--panel-bg);
            border-top: 2px solid var(--accent-cyan);
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 50;
            flex-shrink: 0;
            padding-bottom: 20px; /* iPhone 底部安全区 */
        }

        .status-log {
            text-align: center;
            color: var(--accent-blue);
            font-size: 12px;
            height: 18px;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .input-group { display: flex; gap: 5px; width: 100%; justify-content: center; }

        input {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--accent-blue);
            color: var(--accent-cyan);
            padding: 8px;
            border-radius: 4px;
            width: 100px;
            font-size: 16px; /* 防止iOS放大 */
            outline: none;
        }

        button {
            background: rgba(0, 247, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
        }

        .btn-group-traverse {
            display: flex;
            gap: 4px;
            background: rgba(0,0,0,0.3);
            padding: 4px;
            border-radius: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="title-bar">
        <h1>二叉树矩阵 <span style="font-size:12px; color:#00f7ff;">MOBILE</span></h1>
    </div>

    <div class="main-container" id="treeContainer">
        <svg id="svgLayer"></svg>
        <div id="nodesLayer"></div>
    </div>

    <div class="control-panel">
        <div class="status-log" id="statusLog">// 移动端触控系统就绪</div>
        
        <div class="controls-row">
            <div class="input-group">
                <input type="number" id="valInput" placeholder="数值" onkeydown="if(event.key==='Enter') handleAdd()">
                <button style="font-weight:bold" onclick="handleAdd()">插入</button>
                <button style="font-weight:bold" onclick="handleSearch()">查找</button>
            </div>

            <div class="btn-group-traverse">
                <button onclick="handleTraverse('pre')">前序</button>
                <button onclick="handleTraverse('in')">中序</button>
                <button onclick="handleTraverse('post')">后序</button>
                <button onclick="handleTraverse('level')">层序</button>
            </div>

            <button style="border-color:#ff4d4d; color:#ff4d4d;" onclick="handleClear()">清空</button>
        </div>
    </div>

    <script>
        // ... (数据结构部分保持不变) ...
        class TreeNode {
            constructor(val, x = 0, y = 0) {
                this.val = val;
                this.left = null;
                this.right = null;
                this.x = x; this.y = y;
            }
        }

        class BinarySearchTree {
            constructor() { this.root = null; }
            insert(val, containerW) {
                if (!this.root) {
                    this.root = new TreeNode(val, containerW / 2, 80);
                    return { success: true, node: this.root };
                }
                let current = this.root;
                let depth = 0;
                while (true) {
                    if (val === current.val) return { success: false, node: current };
                    // 移动端优化：间距随深度衰减得更快，防止横向爆屏
                    let offset = (containerW / 2.5) / Math.pow(1.9, depth);
                    if (offset < 35) offset = 35; 

                    if (val < current.val) {
                        if (!current.left) {
                            current.left = new TreeNode(val, current.x - offset, current.y + 70);
                            return { success: true, node: current.left };
                        }
                        current = current.left;
                    } else {
                        if (!current.right) {
                            current.right = new TreeNode(val, current.x + offset, current.y + 70);
                            return { success: true, node: current.right };
                        }
                        current = current.right;
                    }
                    depth++;
                }
            }
        }

        // ... (渲染部分保持不变) ...
        const bst = new BinarySearchTree();
        const container = document.getElementById('treeContainer');
        const svgLayer = document.getElementById('svgLayer');
        const nodesLayer = document.getElementById('nodesLayer');
        const statusLog = document.getElementById('statusLog');
        const input = document.getElementById('valInput');

        let isDragging = false;
        let draggedNodeRoot = null;
        let dragLastPos = { x: 0, y: 0 };
        let isAnimating = false;

        function log(msg) {
            statusLog.innerText = `// ${msg}`;
        }

        function renderTree() {
            svgLayer.innerHTML = '';
            nodesLayer.innerHTML = '';
            if (!bst.root) return;
            drawRecursive(bst.root);
        }

        function drawRecursive(node) {
            if (!node) return;
            const div = document.createElement('div');
            div.className = 'node';
            div.id = `node-${node.val}`;
            div.innerText = node.val;
            div.style.left = node.x + 'px';
            div.style.top = node.y + 'px';
            
            // 关键修改4：同时绑定鼠标和触摸事件
            div.addEventListener('mousedown', (e) => startDrag(e, node));
            div.addEventListener('touchstart', (e) => startDrag(e, node), { passive: false });

            nodesLayer.appendChild(div);
            if (node.left) drawLine(node, node.left);
            if (node.right) drawLine(node, node.right);
            drawRecursive(node.left);
            drawRecursive(node.right);
        }

        function drawLine(parent, child) {
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("id", `link-${parent.val}-${child.val}`);
            path.setAttribute("class", "link");
            path.setAttribute("d", getPathD(parent, child));
            svgLayer.appendChild(path);
        }

        function getPathD(parent, child) {
            const cx1 = parent.x; 
            const cy1 = parent.y + (child.y - parent.y) * 0.5;
            const cx2 = child.x;
            const cy2 = child.y - (child.y - parent.y) * 0.5;
            return `M ${parent.x} ${parent.y} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${child.x} ${child.y}`;
        }

        // --- 核心：兼容移动端的级联拖拽逻辑 ---

        // 辅助：获取事件坐标（兼容鼠标和触摸）
        function getEventPos(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function startDrag(e, node) {
            if(isAnimating) return;
            // 关键：触摸时阻止浏览器默认滚动
            if (e.type === 'touchstart') e.preventDefault(); 
            e.stopPropagation();

            isDragging = true;
            draggedNodeRoot = node;
            
            const pos = getEventPos(e);
            dragLastPos.x = pos.x;
            dragLastPos.y = pos.y;
            
            container.style.cursor = 'grabbing';
            document.getElementById(`node-${node.val}`).style.zIndex = 100;
        }

        // 统一的处理移动函数
        function handleMove(e) {
            if (!isDragging || !draggedNodeRoot) return;
            
            // 如果是触摸移动，必须阻止默认行为，否则屏幕会卷动
            if(e.type === 'touchmove') e.preventDefault();

            const pos = getEventPos(e);
            const dx = pos.x - dragLastPos.x;
            const dy = pos.y - dragLastPos.y;

            dragLastPos.x = pos.x;
            dragLastPos.y = pos.y;

            moveSubtree(draggedNodeRoot, dx, dy);
            
            const parent = findParent(bst.root, draggedNodeRoot.val);
            if (parent) {
                const linkEl = document.getElementById(`link-${parent.val}-${draggedNodeRoot.val}`);
                if (linkEl) linkEl.setAttribute("d", getPathD(parent, draggedNodeRoot));
            }
        }

        // 统一的处理结束函数
        function handleEnd() {
            if(isDragging && draggedNodeRoot) {
                const el = document.getElementById(`node-${draggedNodeRoot.val}`);
                if(el) el.style.zIndex = '';
            }
            isDragging = false;
            draggedNodeRoot = null;
            container.style.cursor = 'grab';
        }

        // 绑定全局事件（同时监听 Mouse 和 Touch）
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', handleMove, { passive: false }); // passive: false 允许 preventDefault

        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('touchend', handleEnd);

        // --- 递归移动逻辑 (保持不变) ---
        function moveSubtree(node, dx, dy) {
            if (!node) return;
            node.x += dx;
            node.y += dy;
            const el = document.getElementById(`node-${node.val}`);
            if (el) {
                el.style.left = node.x + 'px';
                el.style.top = node.y + 'px';
            }
            if (node.left) {
                const linkEl = document.getElementById(`link-${node.val}-${node.left.val}`);
                if (linkEl) linkEl.setAttribute("d", getPathD(node, node.left));
                moveSubtree(node.left, dx, dy);
            }
            if (node.right) {
                const linkEl = document.getElementById(`link-${node.val}-${node.right.val}`);
                if (linkEl) linkEl.setAttribute("d", getPathD(node, node.right));
                moveSubtree(node.right, dx, dy);
            }
        }

        function findParent(node, val) {
            if (!node) return null;
            if ((node.left && node.left.val === val) || (node.right && node.right.val === val)) return node;
            if (val < node.val) return findParent(node.left, val);
            return findParent(node.right, val);
        }

        // --- 算法辅助 ---
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        async function visitNode(node) {
            const el = document.getElementById(`node-${node.val}`);
            if(el) {
                el.classList.add('active');
                await sleep(500);
                el.classList.remove('active');
                await sleep(100);
            }
        }

        // --- 按钮事件 ---
        async function handleAdd() {
            if (isAnimating) return;
            const val = parseInt(input.value);
            if (isNaN(val)) return;
            const result = bst.insert(val, container.offsetWidth);
            if (result.success) {
                log(`插入: ${val}`);
                renderTree(); 
                await visitNode(result.node);
            } else {
                log(`重复: ${val}`);
            }
            input.value = '';
        }

        async function handleSearch() {
            if (isAnimating) return;
            const val = parseInt(input.value);
            if (isNaN(val)) return;
            isAnimating = true;
            log(`查找: ${val}`);
            let curr = bst.root;
            while(curr) {
                const el = document.getElementById(`node-${curr.val}`);
                if(el) el.classList.add('active');
                await sleep(400);
                if(curr.val === val) {
                    log(`找到: ${val}`);
                    setTimeout(() => { if(el) el.classList.remove('active'); }, 1000);
                    isAnimating = false;
                    return;
                }
                if(el) el.classList.remove('active');
                curr = val < curr.val ? curr.left : curr.right;
            }
            log(`未找到`);
            isAnimating = false;
        }

        function handleClear() { bst.root = null; renderTree(); log("已清空"); }

        async function handleTraverse(type) {
            if (isAnimating || !bst.root) return;
            isAnimating = true;
            const btns = document.querySelectorAll('button');
            btns.forEach(b => b.disabled = true);
            
            if (type === 'pre') await preOrder(bst.root);
            else if (type === 'in') await inOrder(bst.root);
            else if (type === 'post') await postOrder(bst.root);
            else if (type === 'level') await levelOrder(bst.root);

            isAnimating = false;
            btns.forEach(b => b.disabled = false);
            log("完成");
        }

        async function preOrder(node) { if(!node) return; await visitNode(node); await preOrder(node.left); await preOrder(node.right); }
        async function inOrder(node) { if(!node) return; await inOrder(node.left); await visitNode(node); await inOrder(node.right); }
        async function postOrder(node) { if(!node) return; await postOrder(node.left); await postOrder(node.right); await visitNode(node); }
        async function levelOrder(root) {
            const q = [root];
            while(q.length) {
                const n = q.shift();
                await visitNode(n);
                if(n.left) q.push(n.left);
                if(n.right) q.push(n.right);
            }
        }

        window.addEventListener('load', () => {
            const w = container.offsetWidth;
            // 手机屏幕窄，少初始几个节点
            [50, 30, 70].forEach(v => bst.insert(v, w));
            renderTree();
        });
    </script>
</body>
</html>
