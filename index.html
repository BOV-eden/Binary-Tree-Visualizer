<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>二叉树 - Final Fix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 配色：加深了连线颜色，确保可见 */
            --bg-color: #f8fafc;       
            --panel-bg: rgba(255, 255, 255, 0.95);
            --accent-primary: #2563eb; /* 更深的蓝 */
            --accent-secondary: #60a5fa; 
            --text-main: #1e293b;
            --text-sub: #64748b;
            --line-color: #475569;     /* 🔴 关键修改：连线改成深灰色，不再隐身 */
            --dot-color: #cbd5e1;
            --highlight: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            position: fixed; top: 0; left: 0; width: 100%; height: 100dvh;
            display: flex; flex-direction: column; overflow: hidden;
            touch-action: none; -webkit-user-select: none; user-select: none;
        }

        /* 顶部栏 */
        .title-bar {
            height: 48px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; border-bottom: 1px solid #e2e8f0;
            flex-shrink: 0; padding-top: env(safe-area-inset-top);
            z-index: 100;
        }
        .title-bar h1 { font-size: 16px; font-weight: 700; color: #0f172a; margin: 0; }
        
        .zoom-controls { display: flex; gap: 8px; }
        .zoom-btn { 
            background: #fff; border: 1px solid #cbd5e1; color: #334155; 
            width: 30px; height: 30px; border-radius: 8px; 
            display: flex; justify-content: center; align-items: center; 
            font-size: 18px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        /* 视口 */
        .viewport {
            flex: 1; position: relative; overflow: hidden;
            width: 100%; height: 100%; cursor: grab;
            background-image: radial-gradient(var(--dot-color) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        .viewport:active { cursor: grabbing; }

        /* 世界层 */
        #worldLayer {
            position: absolute; top: 0; left: 0; width: 0; height: 0;
            transform-origin: 0 0; will-change: transform; z-index: 10;
        }

        /* 🔴 核心修复：SVG 样式 */
        svg {
            position: absolute; 
            top: 0; left: 0;
            /* 关键：给它一个物理尺寸，防止浏览器不渲染 */
            width: 10px; height: 10px; 
            /* 关键：允许内容溢出这个 10px 的盒子 */
            overflow: visible !important; 
            pointer-events: none; 
            z-index: 1; /* 确保在线在节点下面，但背景上面 */
        }

        .link { 
            fill: none; 
            stroke: var(--line-color); 
            stroke-width: 2px;
            /* 移除 vector-effect，防止某些旧浏览器兼容性问题，我们手动控制粗细 */
            opacity: 1;
        }

        /* 节点 */
        .node {
            position: absolute;
            width: 48px; height: 48px;
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: #fff; font-weight: 600; font-size: 14px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            border: 2px solid #fff;
            z-index: 10;
            transform: translate(-50%, -50%);
            touch-action: none;
        }
        .node.active {
            background: var(--highlight);
            box-shadow: 0 0 0 5px rgba(245, 158, 11, 0.2);
            transform: translate(-50%, -50%) scale(1.15);
            border-color: #fff;
            z-index: 20;
        }

        /* 底部控制面板 */
        .control-panel {
            background: var(--panel-bg);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
            border-top: 1px solid #e2e8f0;
            padding: 12px 16px;
            display: flex; flex-direction: column; gap: 10px; z-index: 100; flex-shrink: 0;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
        }
        .status-log { text-align: center; color: var(--text-sub); font-size: 12px; height: 16px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        
        .controls-row { display: flex; align-items: center; gap: 8px; }
        .input-group { display: flex; gap: 6px; flex: 1; }
        
        input { 
            background: #f1f5f9; border: 1px solid #cbd5e1; color: #0f172a; 
            padding: 0 10px; border-radius: 8px; width: 100%; height: 40px; 
            font-size: 16px; /* 防止 iOS 缩放 */
            outline: none; -webkit-appearance: none;
        }
        
        button { 
            background: #fff; border: 1px solid #cbd5e1; color: #475569; 
            padding: 0 14px; height: 40px; border-radius: 8px; font-size: 14px; 
            font-weight: 600; white-space: nowrap; cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        button:active { background: #f1f5f9; transform: scale(0.96); }
        
        button.primary { background: var(--accent-primary); color: #fff; border: none; box-shadow: 0 2px 5px rgba(37, 99, 235, 0.3); }
        button.primary:active { background: #1d4ed8; }
        
        .btn-group-traverse { display: flex; gap: 8px; width: 100%; }
        .btn-group-traverse button { flex: 1; padding: 0; font-size: 13px; color: #475569; }
        
        .btn-clear { color: #dc2626; border-color: #fecaca; background: #fef2f2; }
    </style>
</head>
<body>

    <div class="title-bar">
        <h1>二叉树</h1>
        <div class="zoom-controls">
            <div class="zoom-btn" onclick="zoomOut()">-</div>
            <div class="zoom-btn" onclick="zoomIn()">+</div>
        </div>
    </div>

    <div class="viewport" id="viewport">
        <div id="worldLayer">
            <svg id="svgLayer"></svg>
            <div id="nodesLayer"></div>
        </div>
    </div>

    <div class="control-panel">
        <div class="status-log" id="statusLog">Ready. Drag to pan, pinch to zoom.</div>
        
        <div class="controls-row">
            <div class="input-group">
                <input type="number" id="valInput" placeholder="输入数字" onkeydown="if(event.key==='Enter') handleAdd()">
            </div>
            <button class="primary" onclick="handleAdd()">插入</button>
            <button onclick="handleSearch()">查找</button>
            <button class="btn-clear" onclick="handleClear()">清空</button>
        </div>

        <div class="btn-group-traverse">
            <button onclick="handleTraverse('pre')">前序</button>
            <button onclick="handleTraverse('in')">中序</button>
            <button onclick="handleTraverse('post')">后序</button>
            <button onclick="handleTraverse('level')">层序</button>
        </div>
    </div>

    <script>
        // --- 核心视图状态 ---
        const viewState = { 
            x: window.innerWidth / 2, 
            y: window.innerHeight / 4, 
            scale: 1 
        };
        let isAnimating = false;

        class TreeNode {
            constructor(val, x = 0, y = 0) {
                this.val = val; this.left = null; this.right = null; this.x = x; this.y = y;
            }
        }
        
        class BinarySearchTree {
            constructor() { this.root = null; }
            insert(val) {
                if (!this.root) {
                    this.root = new TreeNode(val, 0, 0);
                    return { success: true, node: this.root };
                }
                let current = this.root;
                let depth = 0;
                while (true) {
                    if (val === current.val) return { success: false, node: current };
                    let offset = 200 / Math.pow(1.85, depth);
                    if (offset < 50) offset = 50; 
                    if (val < current.val) {
                        if (!current.left) {
                            current.left = new TreeNode(val, current.x - offset, current.y + 90);
                            return { success: true, node: current.left };
                        }
                        current = current.left;
                    } else {
                        if (!current.right) {
                            current.right = new TreeNode(val, current.x + offset, current.y + 90);
                            return { success: true, node: current.right };
                        }
                        current = current.right;
                    }
                    depth++;
                }
            }
        }

        const bst = new BinarySearchTree();
        const worldLayer = document.getElementById('worldLayer');
        const svgLayer = document.getElementById('svgLayer');
        const nodesLayer = document.getElementById('nodesLayer');
        const statusLog = document.getElementById('statusLog');
        const input = document.getElementById('valInput');

        function log(msg) { statusLog.innerText = msg; }

        function renderTree() {
            svgLayer.innerHTML = '';
            nodesLayer.innerHTML = '';
            if (bst.root) drawRecursive(bst.root);
        }

        function drawRecursive(node) {
            if (!node) return;
            const div = document.createElement('div');
            div.className = 'node';
            div.id = `node-${node.val}`;
            div.innerText = node.val;
            div.style.left = node.x + 'px';
            div.style.top = node.y + 'px';
            
            const startHandler = (e) => startInteraction(e, 'NODE', node);
            div.addEventListener('mousedown', startHandler);
            div.addEventListener('touchstart', startHandler, { passive: false });

            nodesLayer.appendChild(div);
            
            if (node.left) drawLine(node, node.left);
            if (node.right) drawLine(node, node.right);
            
            drawRecursive(node.left);
            drawRecursive(node.right);
        }

        function drawLine(parent, child) {
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("id", `link-${parent.val}-${child.val}`);
            path.setAttribute("class", "link");
            path.setAttribute("d", getPathD(parent, child));
            // 🔴 手动设置 stroke-width，确保缩放时线不会太细或太粗
            // 这里的逻辑是：不需要随缩放变细，就用固定值
            path.style.strokeWidth = "2px"; 
            svgLayer.appendChild(path);
        }

        function getPathD(parent, child) {
            const cx1 = parent.x; 
            const cy1 = parent.y + (child.y - parent.y) * 0.5;
            const cx2 = child.x;
            const cy2 = child.y - (child.y - parent.y) * 0.5;
            return `M ${parent.x} ${parent.y} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${child.x} ${child.y}`;
        }

        // --- 交互系统 ---
        const viewport = document.getElementById('viewport');
        let mode = null; 
        let startPos = { x: 0, y: 0 };
        let draggedNode = null;
        let lastDist = 0;

        function updateTransform() {
            worldLayer.style.transform = `translate3d(${viewState.x}px, ${viewState.y}px, 0) scale(${viewState.scale})`;
        }

        function getClientPos(e) {
            if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            return { x: e.clientX, y: e.clientY };
        }

        function startInteraction(e, action, node = null) {
            if (isAnimating) return;
            if (e.touches && e.touches.length === 2) return; 

            if (e.type === 'touchstart') e.preventDefault();
            e.stopPropagation();

            mode = action;
            draggedNode = node;
            const pos = getClientPos(e);
            startPos = { x: pos.x, y: pos.y };

            if (mode === 'NODE') {
                document.getElementById(`node-${node.val}`).style.zIndex = 100;
            }
            viewport.style.cursor = 'grabbing';
        }

        function onMove(e) {
             // Pinch
             if (e.touches && e.touches.length === 2) {
                e.preventDefault();
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                if (lastDist > 0) {
                    const delta = dist / lastDist;
                    applyZoom(delta);
                }
                lastDist = dist;
                return;
            }

            if (!mode) return;
            if (e.type === 'touchmove') e.preventDefault();
            
            const pos = getClientPos(e);
            const rawDx = pos.x - startPos.x;
            const rawDy = pos.y - startPos.y;
            startPos = { x: pos.x, y: pos.y };

            if (mode === 'PAN') {
                viewState.x += rawDx;
                viewState.y += rawDy;
                updateTransform();
            } else if (mode === 'NODE') {
                const scaleDx = rawDx / viewState.scale;
                const scaleDy = rawDy / viewState.scale;
                moveSubtree(draggedNode, scaleDx, scaleDy);
                updateNodeLink(draggedNode);
            }
        }

        function handleEnd() {
            if (mode === 'NODE' && draggedNode) {
                const el = document.getElementById(`node-${draggedNode.val}`);
                if(el) el.style.zIndex = '';
            }
            mode = null;
            draggedNode = null;
            lastDist = 0;
            viewport.style.cursor = 'grab';
        }

        viewport.addEventListener('mousedown', (e) => startInteraction(e, 'PAN'));
        viewport.addEventListener('touchstart', (e) => startInteraction(e, 'PAN'), { passive: false });
        window.addEventListener('mousemove', onMove);
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('touchend', handleEnd);

        // --- 缩放逻辑 ---
        function applyZoom(delta) {
            let newScale = viewState.scale * delta;
            if (newScale < 0.2) newScale = 0.2;
            if (newScale > 3) newScale = 3;
            viewState.scale = newScale;
            updateTransform();
        }
        function zoomIn() { applyZoom(1.1); }
        function zoomOut() { applyZoom(0.9); }
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            applyZoom(delta);
        }, { passive: false });

        // --- 辅助逻辑 ---
        function moveSubtree(node, dx, dy) {
            if (!node) return;
            node.x += dx; node.y += dy;
            const el = document.getElementById(`node-${node.val}`);
            if (el) { el.style.left = node.x + 'px'; el.style.top = node.y + 'px'; }
            if (node.left) {
                const linkEl = document.getElementById(`link-${node.val}-${node.left.val}`);
                if (linkEl) linkEl.setAttribute("d", getPathD(node, node.left));
                moveSubtree(node.left, dx, dy);
            }
            if (node.right) {
                const linkEl = document.getElementById(`link-${node.val}-${node.right.val}`);
                if (linkEl) linkEl.setAttribute("d", getPathD(node, node.right));
                moveSubtree(node.right, dx, dy);
            }
        }
        function updateNodeLink(node) {
            const parent = findParent(bst.root, node.val);
            if (parent) {
                const linkEl = document.getElementById(`link-${parent.val}-${node.val}`);
                if (linkEl) linkEl.setAttribute("d", getPathD(parent, node));
            }
        }
        function findParent(node, val) {
            if (!node) return null;
            if ((node.left && node.left.val === val) || (node.right && node.right.val === val)) return node;
            if (val < node.val) return findParent(node.left, val);
            return findParent(node.right, val);
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));
        
        function focusOnNode(x, y) {
            const screenCx = viewport.offsetWidth / 2;
            const screenCy = viewport.offsetHeight / 2;
            viewState.x = screenCx - x * viewState.scale;
            viewState.y = screenCy - y * viewState.scale;
            updateTransform();
        }

        async function visitNode(node) {
            if(!isAnimating) focusOnNode(node.x, node.y);
            const el = document.getElementById(`node-${node.val}`);
            if(el) {
                el.classList.add('active');
                await sleep(500);
                el.classList.remove('active');
                await sleep(100);
            }
        }

        async function handleAdd() {
            if (isAnimating) return;
            const val = parseInt(input.value);
            if (isNaN(val)) return;
            input.blur();

            const result = bst.insert(val);
            if (result.success) {
                log(`已插入: ${val}`);
                renderTree();
                focusOnNode(result.node.x, result.node.y);
                await visitNode(result.node);
            } else { 
                log(`节点 ${val} 已存在`); 
                focusOnNode(result.node.x, result.node.y);
            }
            input.value = '';
        }

        async function handleSearch() {
            if (isAnimating) return;
            const val = parseInt(input.value);
            if (isNaN(val)) return;
            input.blur();
            isAnimating = true;
            log(`正在查找: ${val}...`);
            let curr = bst.root;
            if(curr) focusOnNode(curr.x, curr.y);
            await sleep(500);

            let found = false;
            while(curr) {
                const el = document.getElementById(`node-${curr.val}`);
                if(el) el.classList.add('active');
                focusOnNode(curr.x, curr.y);
                await sleep(400);
                if(curr.val === val) {
                    log(`找到: ${val}`);
                    found = true;
                    setTimeout(() => { if(el) el.classList.remove('active'); }, 1000);
                    break;
                }
                if(el) el.classList.remove('active');
                curr = val < curr.val ? curr.left : curr.right;
            }
            if(!found) log(`未找到 ${val}`);
            isAnimating = false;
        }

        function handleClear() { 
            bst.root = null; renderTree(); 
            viewState.x = window.innerWidth / 2;
            viewState.y = window.innerHeight / 4;
            viewState.scale = 1;
            updateTransform();
            log("画布已清空"); 
        }

        async function handleTraverse(type) {
            if (isAnimating || !bst.root) return;
            isAnimating = true;
            const btns = document.querySelectorAll('button');
            btns.forEach(b => b.disabled = true);
            focusOnNode(bst.root.x, bst.root.y);
            await sleep(500);
            if (type === 'pre') await preOrder(bst.root);
            else if (type === 'in') await inOrder(bst.root);
            else if (type === 'post') await postOrder(bst.root);
            else if (type === 'level') await levelOrder(bst.root);
            isAnimating = false;
            btns.forEach(b => b.disabled = false);
            log("遍历完成");
        }
        
        async function preOrder(node) { if(!node) return; await visitNode(node); await preOrder(node.left); await preOrder(node.right); }
        async function inOrder(node) { if(!node) return; await inOrder(node.left); await visitNode(node); await inOrder(node.right); }
        async function postOrder(node) { if(!node) return; await postOrder(node.left); await postOrder(node.right); await visitNode(node); }
        async function levelOrder(root) {
            const q = [root];
            while(q.length) {
                const n = q.shift();
                await visitNode(n);
                if(n.left) q.push(n.left);
                if(n.right) q.push(n.right);
            }
        }

        window.addEventListener('load', () => {
            updateTransform();
            [40,50,20,30,10,45,70].forEach(v => bst.insert(v));
            renderTree();
        });
    </script>
</body>
</html>
